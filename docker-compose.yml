services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anwar_fresh}
      POSTGRES_USER: ${POSTGRES_USER:-anwar}
      # Required. Set it in Dokploy's Environment tab (URL-safe characters only).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: anwar-fresh-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-Asia/Dhaka}
      DATABASE_URL: postgres://${POSTGRES_USER:-anwar}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-anwar_fresh}

      # Base URL used in password setup/reset emails, e.g. https://fresh.anwargroup.net
      APP_URL: ${APP_URL:-}

      # First Super Admin. While no active Super Admin exists, each start emails this address a
      # fresh invitation (and prints the link to the logs). SUPER_ADMIN_PASSWORD (12+ chars)
      # creates the account directly instead, for servers without email.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
      SUPER_ADMIN_EMPLOYEE_ID: ${SUPER_ADMIN_EMPLOYEE_ID:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      # Hours a staff invitation link stays valid.
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-72}

      # Legacy: creates a System Admin directly. Prefer SUPER_ADMIN_EMAIL + invitations.
      BOOTSTRAP_ADMIN_EMPLOYEE_ID: ${BOOTSTRAP_ADMIN_EMPLOYEE_ID:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      # Email: Microsoft Graph if these are set...
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SENDER_MAILBOX: ${MS_SENDER_MAILBOX:-}
      # ...otherwise SMTP. Defaults send every email to the bundled Mailpit inbox (below).
      # For a real provider set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS and MAIL_CAPTURE=false.
      SMTP_HOST: ${SMTP_HOST:-anwar-fresh-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      # false = accept a self-signed certificate (internal mail server only).
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      # true = the SMTP server is a test inbox (Mailpit): emails are recorded as "captured".
      MAIL_CAPTURE: ${MAIL_CAPTURE:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@anwargroup.net}

      # Demo employees, batches, orders and demo sign-in accounts. Keep false in production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    # No host port is published: Dokploy's Traefik routes the domain to port 3000.
    # For local runs, docker-compose.override.yml publishes it.
    expose:
      - "3000"

  # Catches every email the app sends. In Dokploy, add a domain for service `mailpit`, port 8025,
  # to open the inbox.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Inbox sign-in as "username:password". The inbox shows invitation and password links, so
      # set this whenever the inbox has a public domain. Empty = no sign-in.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    expose:
      - "8025"
      - "1025"
    networks:
      default:
        # Unique name for SMTP_HOST. A domain puts this service on Dokploy's shared network, where
        # "mailpit" can also match another project's Mailpit and emails would go astray.
        aliases:
          - anwar-fresh-mailpit

volumes:
  db-data:
