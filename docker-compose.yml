services:
  # There is no database in this stack on purpose. PostgreSQL runs as its own Dokploy service (or
  # any other Postgres you manage), and `web` reaches it over the Docker network through
  # DATABASE_URL below. A Postgres inside this stack is a local-only affair: see
  # docker-compose.override.yml, which `docker compose up` merges in automatically and Dokploy
  # ignores.

  # Holds the batch mail queue. Publishing to the Employee Database is hundreds of messages that
  # Microsoft 365 only accepts 30 a minute of, so the send is a quarter of an hour of paced work;
  # keeping it here is what lets it survive a restart or a redeploy partway through.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: anwar-fresh-web:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-Asia/Dhaka}
      # The database lives outside this compose file. Either set DATABASE_URL outright, or set
      # POSTGRES_HOST (the Dokploy database service's hostname), POSTGRES_USER, POSTGRES_PASSWORD
      # and POSTGRES_DB and let the URL be assembled from them. The default host is the
      # `anwar-agro` Postgres service in Dokploy, so with
      #   POSTGRES_DB=anwar-agro  POSTGRES_USER=anwar_agro  POSTGRES_PASSWORD=<password>
      # this becomes
      #   postgresql://anwar_agro:<password>@anwar-organic-anwar-agro-db-vd9zl4:5432/anwar-agro
      # The password is interpolated into a URL, so keep it to letters, digits, `-` and `_`.
      # Without a password (or a DATABASE_URL) the app fails at start with a connection error:
      # there is no bundled database to fall back on any more.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-anwar_agro}:${POSTGRES_PASSWORD:-}@${POSTGRES_HOST:-anwar-organic-anwar-agro-db-vd9zl4}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-anwar-agro}}

      # Batch mail queue. Without it the app still sends, in-process and at the same rate, but a
      # restart partway through a send has to be picked up again rather than simply carrying on.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Messages a minute, across the whole app. Microsoft 365 refuses client submissions above
      # 30 a minute per account ("421 4.4.2 ... submission rate ... exceeded"), so this stays
      # under it. Raise it only to match what your provider actually allows.
      MAIL_RATE_PER_MINUTE: ${MAIL_RATE_PER_MINUTE:-25}

      # Base URL of every emailed link, e.g. https://agro.a1polymer.net (scheme included). Set it:
      # booking emails are sent from the mail queue, where there is no web request to read the
      # address from, so without it they can only use the address of the request that published.
      APP_URL: ${APP_URL:-}

      # First Super Admin. While no active Super Admin exists, each start emails this address a
      # fresh invitation (and prints the link to the logs). SUPER_ADMIN_PASSWORD (12+ chars)
      # creates the account directly instead, for servers without email.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
      SUPER_ADMIN_EMPLOYEE_ID: ${SUPER_ADMIN_EMPLOYEE_ID:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      # Hours a staff invitation link stays valid.
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-72}

      # Legacy: creates a System Admin directly. Prefer SUPER_ADMIN_EMAIL + invitations.
      BOOTSTRAP_ADMIN_EMPLOYEE_ID: ${BOOTSTRAP_ADMIN_EMPLOYEE_ID:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      # Email: Microsoft Graph if these are set...
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SENDER_MAILBOX: ${MS_SENDER_MAILBOX:-}
      # ...otherwise SMTP. Defaults send every email to the bundled Mailpit inbox (below), where
      # it is kept, not delivered: NOBODY RECEIVES A BOOKING EMAIL until SMTP_HOST (with
      # SMTP_PORT, SMTP_USER, SMTP_PASS) or the MS_* variables above name a real mail server.
      SMTP_HOST: ${SMTP_HOST:-anwar-fresh-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      # false = accept a self-signed certificate (internal mail server only).
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      # true = the SMTP server is a test inbox (Mailpit): emails are recorded as "captured", never
      # as delivered. Unset, the app decides from the host: Mailpit is a test inbox, anything else
      # is real. Set it only to override that.
      MAIL_CAPTURE: ${MAIL_CAPTURE:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@anwargroup.net}

      # Demo employees, batches, orders and demo sign-in accounts. Keep false in production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    # No host port is published: Dokploy's Traefik routes the domain to port 3000.
    # For local runs, docker-compose.override.yml publishes it.
    expose:
      - "3000"

  # Catches every email the app sends. In Dokploy, add a domain for service `mailpit`, port 8025,
  # to open the inbox.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Inbox sign-in as "username:password". The inbox shows invitation and password links, so
      # set this whenever the inbox has a public domain. Empty = no sign-in.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    expose:
      - "8025"
      - "1025"
    networks:
      default:
        # Unique name for SMTP_HOST. A domain puts this service on Dokploy's shared network, where
        # "mailpit" can also match another project's Mailpit and emails would go astray.
        aliases:
          - anwar-fresh-mailpit

volumes:
  redis-data:
