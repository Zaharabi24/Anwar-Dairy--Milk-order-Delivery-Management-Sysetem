# Local only: `docker compose up` merges this automatically.
# Dokploy runs `docker compose -f docker-compose.yml`, so it ignores this file.
services:
  # A throwaway PostgreSQL for development. Production never runs one in this stack: there the
  # app connects to a separately deployed database through DATABASE_URL (see docker-compose.yml).
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anwar_fresh}
      POSTGRES_USER: ${POSTGRES_USER:-anwar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anwar_local_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Catches every email the app sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  web:
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-anwar}:${POSTGRES_PASSWORD:-anwar_local_dev}@db:5432/${POSTGRES_DB:-anwar_fresh}
      APP_URL: http://localhost:${APP_PORT:-3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Mailpit is a test inbox: emails are recorded as "captured", never as delivered.
      MAIL_CAPTURE: "true"
      SEED_DEMO_DATA: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@12345}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
